services:
  postgres:
    image: postgres:16-alpine
    container_name: coromes-postgres
    environment:
      POSTGRES_DB: coromes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - coromes-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: MQTT Broker (Mosquitto)
  mqtt:
    image: eclipse-mosquitto:2
    container_name: coromes-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mqtt/config:/mosquitto/config
      - ./mqtt/data:/mosquitto/data
      - ./mqtt/log:/mosquitto/log
    environment:
      MOSQUITTO_USERNAME: ""
      MOSQUITTO_PASSWORD: ""

volumes:
  coromes-data: