# Fixed upstream only; this is not a general outbound proxy. Upgrade headers
# preserve Blazor Server's SignalR connection over the SSH loopback listener.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    # Optional reviewed MES snapshot, mounted read-only by the MES profile.
    # Keep the trailing slash so its bound JSON sidecar resolves under /mes/.
    location = /mes { return 302 /mes/; }
    location /mes/ {
        alias /srv/mes/;
        index index.html;
        add_header Cache-Control "no-cache";
    }
    location / {
        proxy_pass http://coromes-blazor:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
